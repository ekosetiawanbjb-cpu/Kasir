<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>KIOS 88</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body{font-family:Arial;margin:0;background:#eef6ff}
header{background:#1976d2;color:#fff;padding:15px;font-weight:bold}
.container{padding:15px}

.card{
 background:#fff;
 padding:15px;
 margin-bottom:15px;
 border-radius:10px;
 box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

button{
 padding:8px 12px;
 border:none;
 border-radius:8px;
 cursor:pointer;
 margin:3px;
}

.btn-primary{background:#1976d2;color:#fff}
.btn-danger{background:red;color:#fff}
.btn-warning{background:orange;color:#fff}

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
 gap:10px;
}

.item{
 border:1px solid #ddd;
 padding:10px;
 border-radius:8px;
 cursor:pointer;
 display:flex;
 flex-direction:column;
 justify-content:space-between;
}

#kategoriFilter button{background:#ddd}
#kategoriFilter .active{background:#1976d2;color:#fff}

.modal{
 position:fixed;
 top:0;left:0;
 width:100%;height:100%;
 background:rgba(0,0,0,0.5);
 display:none;
 justify-content:center;
 align-items:center;
}

.modal-box{
 background:#fff;
 padding:20px;
 border-radius:10px;
}
</style>
</head>

<body>

<header><b>🔥 KIOS 88</b></header>

<div class="container">

<button class="btn-primary" onclick="toggleForm()">+ Kelola Produk</button>

<div id="formArea" style="display:none" class="card">
<input id="nama" placeholder="Nama">
<input id="kategori" placeholder="Kategori">
<select id="kategoriList"></select>
<input id="barcode" placeholder="Barcode">
<input id="modal" type="number" placeholder="Modal">
<input id="jual" type="number" placeholder="Jual">
<input id="stok" type="number" placeholder="Stok">
<button class="btn-primary" onclick="tambahProduk()">Tambah</button>

<hr>

<input type="file" id="fileInput">
<button onclick="importExcel()">Import Excel</button>
</div>

<div class="card">
<input id="search" placeholder="Cari / Scan Barcode" onkeyup="renderProduk()">
<div id="kategoriFilter"></div>
<div id="produkGrid" class="grid"></div>
</div>

<div class="card">

<h3>TOP UP</h3>

<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px">

<select id="topupMode">
  <option value="biasa">BIASA</option>
  <option value="kurir">KURIR</option>
</select>

<input id="topupNominal" type="text" placeholder="Total TOP UP" oninput="formatRupiah(this)">

<button class="btn-warning" onclick="tambahTopup()">
Tambah TOP UP
</button>

</div>
<div id="keranjang"></div>
<p>Total: Rp <span id="total">0</span></p>

<input id="bayar" placeholder="Bayar" oninput="formatRupiah(this)">
<button onclick="hitungKembalian()">Hitung</button>

<p>Kembalian: Rp <span id="kembalian">0</span></p>

<button class="btn-primary" onclick="cetakRawBT()">Print Bluetooth</button>
<button class="btn-primary" onclick="selesai()">Selesai</button>
<button onclick="laporanHarianExcel()">📊 Export Excel</button>
</div>

</div>

<!-- MODAL EDIT -->
<div id="modalEdit" class="modal">
<div class="modal-box">
<h3>Edit Produk</h3>
<input id="editNama">
<input id="editHarga" type="number">
<input id="editStok" type="number">
<br><br>
<button class="btn-primary" onclick="simpanEdit()">Simpan</button>
<button onclick="modalEdit.style.display='none'">Batal</button>
</div>
</div>

<script>
const firebaseConfig={
 apiKey:"AIzaSyDGZ7pQrWMxNXBWP7Dnxqq7M8pheGHaUQ4",
 authDomain:"kios-88.firebaseapp.com",
 projectId:"kios-88"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

let dataProduk=[], keranjangData=[], kategoriAktif=null, editId=null;
 
function formatRupiah(input){
  let angka = input.value.replace(/\D/g,'');
  input.value = Number(angka).toLocaleString('id-ID');
}
 
function hitungAdminTopup(nominal, mode){

 nominal = Number(nominal || 0);

 // =========================
 // MODE BIASA
 // =========================
 if(mode === 'biasa'){

  if(nominal <= 10000) return 1000;
  if(nominal <= 200000) return 2000;
  if(nominal <= 500000) return 3000;
  if(nominal <= 3000000) return 5000;

  // di atas 3jt naik tiap 1jt
  return 5000 + Math.ceil((nominal - 3000000) / 1000000) * 1000;
 }

 // =========================
 // MODE KURIR
 // =========================
 if(mode === 'kurir'){

  if(nominal <= 10000) return 1000;
  if(nominal <= 500000) return 2000;
  if(nominal <= 3000000) return 3000;
  if(nominal <= 5000000) return 5000;

  // di atas 5jt naik tiap 1jt
  return 5000 + Math.ceil((nominal - 5000000) / 1000000) * 1000;
 }

 return 0;
}
 
function toggleForm(){
 formArea.style.display =
 formArea.style.display==='none'?'block':'none';
}

db.collection('produk').onSnapshot(snap=>{
 dataProduk=snap.docs.map(d=>({id:d.id,...d.data()}));
 renderKategori();
 renderProduk();
});

function tambahProduk(){
 if(jual.value < modal.value){
  alert("Harga jual lebih kecil dari modal!");
  return;
 }

 db.collection('produk').add({
  nama:nama.value,
  kategori:(kategori.value||'lainnya').toLowerCase(),
  barcode:barcode.value||'-',
  harga_modal:+modal.value,
  harga_jual:+jual.value,
  stok:+stok.value
 });
}

function importExcel(){
 const file=fileInput.files[0];
 if(!file)return alert("Pilih file");

 const reader=new FileReader();
 reader.onload=e=>{
  const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
  const data=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);

  data.forEach(i=>{
   db.collection('produk').add({
    nama:i.nama,
    kategori:(i.kategori||'lainnya').toLowerCase(),
    barcode:i.barcode||'-',
    harga_modal:+i.harga_modal||0,
    harga_jual:+i.harga_jual||0,
    stok:+i.stok||0
   });
  });
 };
 reader.readAsArrayBuffer(file);
}

function renderKategori(){
 const list=[...new Set(dataProduk.map(p=>p.kategori))];
 kategoriFilter.innerHTML='';
 kategoriList.innerHTML='<option value="">--Pilih--</option>';

 list.forEach(k=>{
  const btn=document.createElement('button');
  btn.textContent=k.toUpperCase();

  if(kategoriAktif===k) btn.classList.add('active');

  const del=document.createElement('span');
  del.textContent=' ❌';
  del.onclick=(e)=>{
    e.stopPropagation();
    hapusKategori(k);
  };

  btn.appendChild(del);

  btn.onclick=()=>{
    kategoriAktif=(kategoriAktif===k)?null:k;
    renderKategori();
    renderProduk();
  };

  kategoriFilter.appendChild(btn);

  const opt=document.createElement('option');
  opt.value=k;
  opt.textContent=k;
  kategoriList.appendChild(opt);
 });

 kategoriList.onchange=()=>kategori.value=kategoriList.value;
}

function hapusKategori(k){
 if(!confirm("Hapus semua produk kategori ini?")) return;

 dataProduk
 .filter(p=>p.kategori===k)
 .forEach(p=>{
   db.collection('produk').doc(p.id).delete();
 });
}

function renderProduk(){
 produkGrid.innerHTML='';

 const q = search.value.toLowerCase();

 let filtered = dataProduk;

 // 🔥 kalau ada isi search → override kategori
 if(q){
  filtered = dataProduk.filter(p =>
    p.nama.toLowerCase().includes(q) ||
    p.barcode.includes(q)
  );
 }else{
  // kalau kosong → pakai kategori
  if(!kategoriAktif) return;

  filtered = dataProduk.filter(p =>
    p.kategori === kategoriAktif
  );
 }

 filtered.forEach(p=>{
  const el=document.createElement('div');
  el.className='item';

  el.innerHTML=`
   <div>
     <b>${p.nama}</b><br>
     Rp ${p.harga_jual}<br>
     Stok:${p.stok}
   </div>
  `;

  el.onclick=()=>addKeranjang(p);

  // tombol edit & hapus tetap
  const action=document.createElement('div');
  action.style.display='flex';
  action.style.justifyContent='space-between';

  const edit=document.createElement('button');
  edit.textContent='Edit';
  edit.className='btn-warning';

  const del=document.createElement('button');
  del.textContent='Hapus';
  del.className='btn-danger';

  edit.onclick=(e)=>{e.stopPropagation();bukaEdit(p)};
  del.onclick=(e)=>{e.stopPropagation();hapusProduk(p.id)};

  action.appendChild(edit);
  action.appendChild(del);

  el.appendChild(action);

  produkGrid.appendChild(el);
 });
}

function hapusProduk(id){
 if(confirm("Hapus produk?")){
  db.collection('produk').doc(id).delete();
 }
}

function bukaEdit(p){
 editId=p.id;
 editNama.value=p.nama;
 editHarga.value=p.harga_jual;
 editStok.value=p.stok;
 modalEdit.style.display='flex';
}

function simpanEdit(){
 db.collection('produk').doc(editId).update({
  nama:editNama.value,
  harga_jual:+editHarga.value,
  stok:+editStok.value
 });
 modalEdit.style.display='none';
}

function tambahTopup(){

 const nominal = Number(
  topupNominal.value.replace(/\./g,'') || 0
);
 const mode = topupMode.value;

 if(nominal <= 0){
  alert('Masukkan nominal TOP UP');
  return;
 }

 const admin = hitungAdminTopup(nominal, mode);
 const total = nominal + admin;

 keranjangData.push({
  id:'TOPUP-' + Date.now(),
  nama:'TOP UP ' + mode.toUpperCase() + ' Rp ' + nominal.toLocaleString('id-ID'),
  harga:total,
  qty:1,
  total:total,

  // khusus laporan
  is_topup:true,
  topup_mode:mode,
  nominal_topup:nominal,
  admin_topup:admin,
  harga_modal:nominal
 });

 topupNominal.value='';

 renderKeranjang();
}
 
function addKeranjang(p){
 const ex=keranjangData.find(x=>x.id===p.id);

 if(ex){
  if(ex.qty >= p.stok){
    alert("Stok habis");
    return;
  }
  ex.qty++;
  ex.total+=p.harga_jual;
 }else{
  keranjangData.push({
    id:p.id,
    nama:p.nama,
    harga:p.harga_jual,
    qty:1,
    total:p.harga_jual
  });
 }

 renderKeranjang();
}

function renderKeranjang(){
 let t=0;
 keranjang.innerHTML='';

 keranjangData.forEach((i,idx)=>{
 keranjang.innerHTML+=`
  ${i.nama}
  ${i.is_topup ? '(Admin: Rp ' + i.admin_topup.toLocaleString('id-ID') + ')' : ''}
  x${i.qty} = Rp ${i.total.toLocaleString('id-ID')}
  <button onclick="hapusItem(${idx})">X</button><br>
`;
  t+=i.total;
 });

 total.textContent=t;
}

function hapusItem(i){
 keranjangData.splice(i,1);
 renderKeranjang();
}

function hitungKembalian(){
 const totalBelanja=Number(total.textContent||0);
 const uang = Number(
  bayar.value.replace(/\./g,'') || 0
);
 const kembali=uang-totalBelanja;
 kembalian.textContent = kembali>=0 ? kembali : 0;
}

// 🔥 GLOBAL (taruh di atas script)
let nomorTransaksi = Number(localStorage.getItem("trx") || 1);

// 🔥 HELPER
function wrapText(text, max){
  let lines = [];
  while(text.length > max){
    lines.push(text.substring(0, max));
    text = text.substring(max);
  }
  lines.push(text);
  return lines;
}

function padRight(text, length){
  return text + " ".repeat(Math.max(0, length - text.length));
}

function padLeft(text, length){
  return " ".repeat(Math.max(0, length - text.length)) + text;
}

// 🔥 STRUK PREMIUM FINAL
function generateStruk(){

  const width = 32;

  const totalBelanja = Number(total.textContent || 0);

const uang = Number(
  bayar.value.replace(/\./g,'') || 0
);
  const bayarUang = Number(
  bayar.value.replace(/\./g,'') || 0
);
  const kembali = bayarUang - totalBelanja;

  const now = new Date();
  const tanggal = now.toLocaleDateString('id-ID');
  const jam = now.toLocaleTimeString('id-ID');

  const trx = "TRX" + String(nomorTransaksi).padStart(4, '0');

  let s = "";

  // HEADER
  s += "\x1B\x45\x01"; // 🔥 ON BOLD
  s += padLeft("KIOS 88", (width + "KIOS 88".length)/2) + "\n";
  s += "\x1B\x45\x00"; // OFF BOLD
  s += "-".repeat(width) + "\n";

  s += "No  : " + trx + "\n";
  s += "Tgl : " + tanggal + "\n";
  s += "Jam : " + jam + "\n";
  s += "-".repeat(width) + "\n";

  // PRODUK
  keranjangData.forEach(item => {

    let namaLines = wrapText(item.nama, width);

    namaLines.forEach(line => {
      s += line + "\n";
    });

    let kiri = item.qty + " x Rp " + item.harga.toLocaleString('id-ID');
    let kanan = " Rp " + item.total.toLocaleString('id-ID');

    s += padRight(kiri, width - kanan.length) + kanan + "\n";
  });

  s += "-".repeat(width) + "\n";

  // TOTAL
  s += padRight("Total", width - totalBelanja.toLocaleString('id-ID').length) 
       + totalBelanja.toLocaleString('id-ID') + "\n";

  s += padRight("Bayar", width - bayarUang.toLocaleString('id-ID').length) 
       + bayarUang.toLocaleString('id-ID') + "\n";

  let kembaliFix = kembali >= 0 ? kembali : 0;

  s += padRight("Kembali", width - kembaliFix.toLocaleString('id-ID').length) 
       + kembaliFix.toLocaleString('id-ID') + "\n";

  s += "-".repeat(width) + "\n";

  // FOOTER
  s += "\x1B\x45\x01";
  s += padLeft("Terima Kasih", (width + "Terima Kasih".length)/2) + "\n";
  s += padLeft("KIOS 88", (width + "KIOS 88".length)/2) + "\n\n\n";
  s += "\x1B\x45\x00";
  return s;
}

window.cetakRawBT = function(){
  const text = generateStruk(); // 🔥 INI KUNCINYA
 if(!text) return; 
 if(navigator.share){
    navigator.share({
      text: text
    });
  }
  else{
    alert("Browser tidak support share");
  }
}

// 🔥 UPDATE DI FUNCTION selesai()
async function selesai(){
 
if(keranjangData.length <= 0){
  alert("Keranjang kosong!");
  return;
}
const totalBelanja = Number(total.textContent || 0);

const uang = Number(
  bayar.value.replace(/\./g,'') || 0
);

if(uang < totalBelanja){
  alert("Uang pembayaran kurang!");
  return;
}

if(window.loadingSelesai) return;
window.loadingSelesai = true;

  try{

    // 1. CEK STOK
    for(const item of keranjangData){

  // skip topup
  if(item.is_topup) continue;

  const p = dataProduk.find(x=>x.id===item.id);

  if(!p || p.stok < item.qty){
    alert("Stok tidak cukup!");
    window.loadingSelesai = false;
    return;
  }
}

    // 2. SIMPAN TRANSAKSI
    await db.collection('transaksi').add({
      tanggal: new Date(),
     items: keranjangData.map(i=>{

  // kalau TOPUP
  if(i.is_topup){
    return i;
  }

  const p = dataProduk.find(x=>x.id===i.id);

  return {
    ...i,
    harga_modal: p?.harga_modal || 0
  }
}),
      total: Number(total.textContent || 0),
      bayar: Number(
  bayar.value.replace(/\./g,'') || 0
),
      kembali: Number(kembalian.textContent || 0)
    });

    // 3. UPDATE STOK
    for(const item of keranjangData){
      const p = dataProduk.find(x=>x.id===item.id);
      if(!p) continue;

      await db.collection('produk').doc(p.id).update({
        stok: p.stok - item.qty
      });
    }

    // 4. RESET
    nomorTransaksi++;
    localStorage.setItem("trx", nomorTransaksi);

    keranjangData = [];
    renderKeranjang();

    alert("Transaksi selesai!");

  }catch(err){
    console.error(err);
    alert("Terjadi error, cek koneksi!");
  }

  window.loadingSelesai = false;
}

 async function laporanHarianExcel(){
   
  let start = new Date();
  start.setHours(0,0,0,0);

  let end = new Date();
  end.setHours(23,59,59,999);

  const snap = await db.collection('transaksi')
    .where('tanggal','>=',start)
    .where('tanggal','<=',end)
    .get();

   if(snap.empty){
    alert("Belum ada transaksi hari ini");
    return;
  }

  let dataExcel = [];
  let totalOmzet = 0;
  let totalModal = 0;

  snap.forEach(docSnap=>{
    const trx = docSnap.data();

    trx.items.forEach(i=>{
      
     let modal = 0;
let jual = i.total;
let profit = 0;

if(i.is_topup){

 modal = i.nominal_topup;
 profit = i.admin_topup;

}else{

 modal = (i.harga_modal || 0) * i.qty;
 profit = jual - modal;
}

      totalOmzet += jual;
      totalModal += modal;
      let jenis = i.is_topup ? 'TOP UP' : 'PRODUK';

      dataExcel.push({
  tanggal: trx.tanggal.toDate().toLocaleString('id-ID'),
  jenis: jenis,
  nama: i.nama,
  qty: i.qty,
  harga_jual: i.harga,
  total_jual: jual,
  total_modal: modal,
  keuntungan: profit
      });
    });
  });

// 🔥 HEADER EXCEL (TARUH DI SINI)
dataExcel.unshift({
  tanggal:"Tanggal",
  jenis:"Jenis",
  nama:"Produk",
  qty:"Qty",
  harga_jual:"Harga Jual",
  total_jual:"Total Jual",
  total_modal:"Modal",
  keuntungan:"Profit"
});
  
  // 🔥 TAMBAH SUMMARY DI BAWAH
  dataExcel.push({});
  dataExcel.push({
    nama: "TOTAL OMZET",
    total_jual: totalOmzet
  });
  dataExcel.push({
    nama: "TOTAL MODAL",
    total_modal: totalModal
  });
  dataExcel.push({
    nama: "PROFIT",
    keuntungan: totalOmzet - totalModal
  });

  // 🔥 BUAT FILE EXCEL
  const ws = XLSX.utils.json_to_sheet(dataExcel, {
  skipHeader: true
});
  const wb = XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(wb, ws, "Laporan");

  XLSX.writeFile(wb, "laporan_harian.xlsx");
}
</script>

</body>
</html>
